<!doctype html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SoulScope — статистика Deadlock</title>
  <meta name="description" content="SoulScope — статистика Deadlock: тир-лист героев, актуальные билды, контр-предметы, патч-трекер, ранги и лучшие связки на линии по винрейту." />
  <link rel="icon" href="img/logo.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@700;800;900&display=swap&subset=cyrillic" rel="stylesheet" />
  <link rel="preconnect" href="https://api.deadlock-api.com" crossorigin />
  <link rel="preconnect" href="https://assets-bucket.deadlock-api.com" />
  <link rel="stylesheet" href="css/style.css" />
  <script>
    try { const t = localStorage.getItem('dt.theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
</head>
<body>
  <div class="ticker" id="ticker"><div class="ticker-inner"><span class="live">LIVE</span><span class="tk muted" data-t="tickerLoading">Загружаем статистику…</span></div></div>
  <div class="banner hidden" id="banner"></div>

  <header class="site">
    <div class="header-inner">
      <a class="logo" href="#/">
        <img class="logo-mark" src="img/logo.svg" alt="" />
        <div>
          <div class="logo-text">Soul<span>Scope</span></div>
          <div class="logo-sub">deadlock analytics</div>
        </div>
      </a>
      <nav class="tabs" id="tabs">
        <a href="#/" data-route="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg><span data-t="nav.home">Главная</span></a>
        <a href="#/tier" data-route="tier"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h11M4 18h6"/></svg><span data-t="nav.tier">Тир-лист</span></a>
        <a href="#/heroes" data-route="heroes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg><span data-t="nav.heroes">Герои и билды</span></a>
        <a href="#/counters" data-route="counters"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3l8 4v5c0 5-3.5 8-8 9-4.5-1-8-4-8-9V7z"/><path d="M9 12l2 2 4-4"/></svg><span data-t="nav.counters">Контр-предметы</span></a>
        <a href="#/patches" data-route="patches"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 3H6a1 1 0 0 0-1 1v16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V8z"/><path d="M14 3v5h5M9 13h6M9 17h4"/></svg><span data-t="nav.patches">Патч-трекер</span></a>
        <a href="#/duos" data-route="duos"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="8" cy="9" r="3"/><circle cx="16" cy="9" r="3"/><path d="M2 20c.8-3 3-5 6-5s5.2 2 6 5M14 15.3c.6-.2 1.3-.3 2-.3 3 0 5.2 2 6 5"/></svg><span data-t="nav.duos">Связки на линии</span></a>
        <a href="#/map" data-route="map"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2-6-2z"/><path d="M9 4v14M15 6v14"/></svg><span data-t="nav.map">Карта</span></a>
        <a href="#/ranks" data-route="ranks"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2l3 6 6 .9-4.5 4.3 1 6.3L12 16.6 6.5 19.5l1-6.3L3 8.9 9 8z"/></svg><span data-t="nav.ranks">Ранги</span></a>
      </nav>
      <div class="header-tools">
        <button class="icon-btn search-btn" id="searchBtn" title="Поиск героя" data-t-title="searchTitle">
          <span class="row" style="gap:6px"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><span class="lbl" data-t="search">Поиск героя…</span></span>
          <span class="kbd">Ctrl K</span>
        </button>
        <button class="icon-btn" id="langBtn" title="Язык сайта" data-t-title="langTitle">RU</button>
        <div class="theme-switch" id="themeSwitch" role="radiogroup" aria-label="Тема оформления"></div>
      </div>
    </div>
  </header>

  <main id="app"></main>

  <footer class="site">
    <div class="inner">
      <div><b style="color:var(--text)">SoulScope</b> <span data-t="footAbout">— фанатская аналитика Deadlock. Не связан с Valve.</span></div>
      <div><span data-t="footData">Данные:</span> <a href="https://deadlock-api.com" target="_blank" rel="noopener">deadlock-api.com</a> · <span data-t="footNotes">патчноуты</span>: Steam / playdeadlock.com · <span id="assetsInfo"></span></div>
    </div>
  </footer>

  <div id="tip"></div>
  <!-- Статистика посещений: GoatCounter (без cookie). Просмотры отправляет js/app.js при смене вкладки. -->
  <script data-goatcounter="https://jisatsssu.goatcounter.com/count" data-goatcounter-settings='{"no_onload": true}' async src="https://gc.zgo.at/count.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
